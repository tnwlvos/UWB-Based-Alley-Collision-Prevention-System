<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2200" viewBox="0 0 1800 2200">
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#111" stroke-width="1.6"/></marker><style>text{font-family:Arial,'Malgun Gothic',sans-serif;fill:#111}.t{font-size:23px;font-weight:bold;text-anchor:middle}.p{font-size:25px;font-weight:bold;text-anchor:middle}.m{font-size:20px;text-anchor:middle}.n{font-size:20px;font-weight:bold;font-style:italic;text-anchor:middle}.life{stroke:#111;stroke-width:2.1;stroke-dasharray:5 6}.f{fill:none;stroke:#111;stroke-width:2.7}.d{stroke:#111;stroke-width:2.7;stroke-dasharray:12 7}.s{stroke:#111;stroke-width:2.6;fill:none;marker-end:url(#a)}.q{stroke:#111;stroke-width:2.3;fill:none;stroke-dasharray:8 6;marker-end:url(#r)}.c{fill:#111}.ct{fill:white;font-size:13px;font-weight:bold;text-anchor:middle;dominant-baseline:middle}</style></defs>
<rect width="1800" height="2200" fill="white"/>
<!-- actor headers -->
<g><rect x="45" y="30" width="210" height="70" rx="8" fill="#f7edf8" stroke="#b56dab" stroke-width="2"/><text x="150" y="74" class="t">PC Processing</text><rect x="360" y="30" width="230" height="70" rx="8" fill="#e7f7f1" stroke="#65ad98" stroke-width="2"/><text x="475" y="74" class="t">Master Anchor (A0)</text><rect x="705" y="30" width="250" height="70" rx="8" fill="#fff5e7" stroke="#b99a68" stroke-width="2"/><text x="830" y="74" class="t">Slave Anchor (A1-A3)</text><rect x="1115" y="30" width="170" height="70" rx="8" fill="#e8f8fa" stroke="#57aabd" stroke-width="2"/><text x="1200" y="74" class="t">UWB Tag</text><rect x="1450" y="30" width="230" height="70" rx="8" fill="#edf9ee" stroke="#69ad73" stroke-width="2"/><text x="1565" y="74" class="t">User Application</text></g>
<!-- frames are deliberately transparent; lifelines are redrawn after every frame -->
<g><rect x="60" y="135" width="1620" height="46" fill="#fff2a8" stroke="#b99b32" stroke-width="1.8"/><text x="870" y="166" class="p">Phase 1: Tag Discovery (태그 탐색)</text><rect x="460" y="250" width="755" height="420" class="f"/><path d="M460 250h60v35l-15 15h-45z" fill="white" stroke="#111" stroke-width="2.7"/><text x="483" y="280" font-size="21" font-weight="bold">alt</text><line x1="460" y1="390" x2="1215" y2="390" class="d"/><rect x="60" y="720" width="1620" height="46" fill="#fff2a8" stroke="#b99b32" stroke-width="1.8"/><text x="870" y="751" class="p">Phase 2: Distance Measurement (거리 측정)</text><rect x="460" y="785" width="755" height="315" class="f"/><path d="M460 785h60v35l-15 15h-45z" fill="white" stroke="#111" stroke-width="2.7"/><text x="483" y="815" font-size="21" font-weight="bold">alt</text><line x1="460" y1="925" x2="1215" y2="925" class="d"/><rect x="60" y="1260" width="1620" height="46" fill="#fff2a8" stroke="#b99b32" stroke-width="1.8"/><text x="870" y="1291" class="p">Phase 3: Reporting &amp; Processing (데이터 보고 및 처리)</text><rect x="460" y="1325" width="755" height="350" class="f"/><path d="M460 1325h60v35l-15 15h-45z" fill="white" stroke="#111" stroke-width="2.7"/><text x="483" y="1355" font-size="21" font-weight="bold">alt</text><line x1="460" y1="1470" x2="1215" y2="1470" class="d"/><rect x="60" y="1875" width="1620" height="46" fill="#fff2a8" stroke="#b99b32" stroke-width="1.8"/><text x="870" y="1906" class="p">Phase 4: Warning Feedback (위험 알림)</text></g>
<!-- continuous protocol lifelines: intentionally above frames -->
<g class="life"><line x1="150" y1="100" x2="150" y2="2100"/><line x1="475" y1="100" x2="475" y2="2100"/><line x1="830" y1="100" x2="830" y2="2100"/><line x1="1200" y1="100" x2="1200" y2="2100"/><line x1="1565" y1="100" x2="1565" y2="2100"/></g>
<g><text x="838" y="215" class="m">TAG_REQUEST (탐색 요청)</text><line x1="475" y1="235" x2="1200" y2="235" class="s"/><text x="838" y="325" class="n">[Direct Discovery (정상 수신)]</text><text x="838" y="345" class="m">TAG_RESPONSE</text><line x1="1200" y1="365" x2="475" y2="365" class="q"/><text x="838" y="420" class="n">[Delegated Discovery (음영 구역 발생 시)]</text><text x="652" y="450" class="m">A2_DISCOVERY_GO (탐색 위임)</text><line x1="475" y1="470" x2="830" y2="470" class="s"/><text x="1015" y="505" class="m">TAG_REQUEST</text><line x1="830" y1="525" x2="1200" y2="525" class="s"/><text x="1015" y="560" class="m">TAG_RESPONSE</text><line x1="1200" y1="580" x2="830" y2="580" class="q"/><text x="652" y="615" class="m">A2_DISCOVERY_REPORT (발견 목록 보고)</text><line x1="830" y1="635" x2="475" y2="635" class="q"/>
<text x="838" y="845" class="n">[Direct Beacon]</text><text x="838" y="875" class="m">BEACON (Tag_ID, riskLevel)</text><line x1="475" y1="895" x2="1200" y2="895" class="s"/><text x="838" y="957" class="n">[Delegated Beacon]</text><text x="652" y="985" class="m">BEACON_DELEGATE (비콘 위임)</text><line x1="475" y1="1005" x2="830" y2="1005" class="s"/><text x="1015" y="1040" class="m">BEACON (Tag_ID, riskLevel)</text><line x1="830" y1="1060" x2="1200" y2="1060" class="s"/><text x="1383" y="1120" class="m">속도 데이터 요청 (Speed Request)</text><line x1="1200" y1="1140" x2="1565" y2="1140" class="s"/><text x="1383" y="1175" class="m">속도 전달 (Speed Delivery)</text><line x1="1565" y1="1195" x2="1200" y2="1195" class="q"/>
<text x="838" y="1388" class="n">[Direct Report]</text><text x="838" y="1420" class="m">FINAL_REPORT (거리리스트, 속력)</text><line x1="1200" y1="1440" x2="475" y2="1440" class="s"/><text x="838" y="1505" class="n">[Delegated Report]</text><text x="1015" y="1535" class="m">DELEGATED_FINAL_REPORT</text><line x1="1200" y1="1555" x2="830" y2="1555" class="s"/><text x="652" y="1600" class="m">Relay Report (데이터 릴레이 송신)</text><line x1="830" y1="1620" x2="475" y2="1620" class="s"/><text x="312" y="1720" class="m">거리 및 속도 데이터 전송 (UART)</text><line x1="475" y1="1740" x2="150" y2="1740" class="s"/><text x="312" y="1790" class="m">계산된 riskLevel 응답</text><line x1="150" y1="1810" x2="475" y2="1810" class="q"/>
<text x="838" y="1955" class="m">riskLevel 전송</text><line x1="475" y1="1975" x2="1200" y2="1975" class="s"/><text x="1383" y="2015" class="m">위험도에 따른 경고 UI 출력 (녹/황/적색)</text><line x1="1200" y1="2035" x2="1565" y2="2035" class="s"/></g>
<!-- numbering --> <g class="c"><circle cx="475" cy="235" r="12"/><circle cx="1200" cy="365" r="12"/><circle cx="475" cy="470" r="12"/><circle cx="830" cy="525" r="12"/><circle cx="1200" cy="580" r="12"/><circle cx="830" cy="635" r="12"/><circle cx="475" cy="895" r="12"/><circle cx="475" cy="1005" r="12"/><circle cx="830" cy="1060" r="12"/><circle cx="1200" cy="1140" r="12"/><circle cx="1565" cy="1195" r="12"/><circle cx="1200" cy="1440" r="12"/><circle cx="1200" cy="1555" r="12"/><circle cx="830" cy="1620" r="12"/><circle cx="475" cy="1740" r="12"/><circle cx="150" cy="1810" r="12"/><circle cx="475" cy="1975" r="12"/><circle cx="1200" cy="2035" r="12"/></g><g class="ct"><text x="475" y="235">1</text><text x="1200" y="365">2</text><text x="475" y="470">3</text><text x="830" y="525">4</text><text x="1200" y="580">5</text><text x="830" y="635">6</text><text x="475" y="895">7</text><text x="475" y="1005">8</text><text x="830" y="1060">9</text><text x="1200" y="1140">10</text><text x="1565" y="1195">11</text><text x="1200" y="1440">12</text><text x="1200" y="1555">13</text><text x="830" y="1620">14</text><text x="475" y="1740">15</text><text x="150" y="1810">16</text><text x="475" y="1975">17</text><text x="1200" y="2035">18</text></g>
</svg>
