<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d3748"/>
    </marker>
    <style>
      .title { font: 700 34px 'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif; fill: #1a202c; }
      .subtitle { font: 500 18px 'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif; fill: #4a5568; }
      .lane-title { font: 700 22px 'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif; fill: #1a202c; }
      .box-title { font: 700 18px 'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif; fill: #1a202c; }
      .box-text { font: 500 15px 'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif; fill: #2d3748; }
      .small { font: 500 13px 'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif; fill: #4a5568; }
      .msg { font: 700 15px 'Malgun Gothic', 'Apple SD Gothic Neo', Arial, sans-serif; fill: #c53030; }
      .line { stroke: #2d3748; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #718096; stroke-width: 2; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .note { fill: #fffaf0; stroke: #ed8936; stroke-width: 2; }
      .anchor0 { fill: #ebf8ff; stroke: #3182ce; stroke-width: 2.5; }
      .anchor2 { fill: #faf5ff; stroke: #805ad5; stroke-width: 2.5; }
      .tag { fill: #f0fff4; stroke: #38a169; stroke-width: 2.5; }
      .pc { fill: #fff5f5; stroke: #e53e3e; stroke-width: 2.5; }
      .decision { fill: #ffffff; stroke: #2d3748; stroke-width: 2.2; }
      .lane { fill: #f7fafc; stroke: #cbd5e0; stroke-width: 1.5; stroke-dasharray: 6 6; }
    </style>
  </defs>

  <rect x="0" y="0" width="1600" height="1100" fill="#ffffff"/>

  <text x="800" y="55" text-anchor="middle" class="title">슬레이브 앵커 TAG_REQUEST 송신 조건 순서도</text>
  <text x="800" y="88" text-anchor="middle" class="subtitle">현재 코드 기준: Anchor2만 Anchor0의 A2_DISCOVERY_GO 수신 시 TAG_REQUEST를 직접 송신</text>

  <rect x="45" y="125" width="360" height="845" rx="18" class="lane"/>
  <rect x="445" y="125" width="360" height="845" rx="18" class="lane"/>
  <rect x="845" y="125" width="360" height="845" rx="18" class="lane"/>
  <rect x="1245" y="125" width="310" height="845" rx="18" class="lane"/>

  <text x="225" y="164" text-anchor="middle" class="lane-title">마스터 앵커 A0</text>
  <text x="625" y="164" text-anchor="middle" class="lane-title">슬레이브 앵커 A2</text>
  <text x="1025" y="164" text-anchor="middle" class="lane-title">태그</text>
  <text x="1400" y="164" text-anchor="middle" class="lane-title">PC Processing</text>

  <rect x="100" y="205" width="250" height="74" rx="10" class="anchor0"/>
  <text x="225" y="234" text-anchor="middle" class="box-title">탐색 주기 도달</text>
  <text x="225" y="258" text-anchor="middle" class="box-text">Active Tag 수에 따라 결정</text>

  <rect x="90" y="320" width="270" height="78" rx="10" class="anchor0"/>
  <text x="225" y="348" text-anchor="middle" class="box-title">A0 직접 TAG_REQUEST</text>
  <text x="225" y="372" text-anchor="middle" class="box-text">data[0] = 7</text>
  <text x="225" y="392" text-anchor="middle" class="small">data[16] = 0</text>

  <polygon points="225,445 345,515 225,585 105,515" class="decision"/>
  <text x="225" y="503" text-anchor="middle" class="box-title">A0가 태그를</text>
  <text x="225" y="528" text-anchor="middle" class="box-title">찾았는가?</text>

  <polygon points="225,635 350,705 225,775 100,705" class="decision"/>
  <text x="225" y="690" text-anchor="middle" class="box-title">Active Tag가</text>
  <text x="225" y="715" text-anchor="middle" class="box-title">1개뿐인가?</text>

  <rect x="85" y="820" width="280" height="74" rx="10" class="anchor0"/>
  <text x="225" y="848" text-anchor="middle" class="box-title">A2 보조 탐색 요청</text>
  <text x="225" y="872" text-anchor="middle" class="box-text">A2_DISCOVERY_GO</text>

  <rect x="490" y="320" width="270" height="78" rx="10" class="anchor2"/>
  <text x="625" y="348" text-anchor="middle" class="box-title">A0 탐색 응답 감청</text>
  <text x="625" y="372" text-anchor="middle" class="box-text">TAG_RESPONSE 수동 수집</text>
  <text x="625" y="392" text-anchor="middle" class="small">직접 송신 아님</text>

  <rect x="490" y="820" width="270" height="74" rx="10" class="anchor2"/>
  <text x="625" y="848" text-anchor="middle" class="box-title">A2_DISCOVERY_GO 수신</text>
  <text x="625" y="872" text-anchor="middle" class="box-text">data[16] == MY_ID</text>

  <rect x="490" y="930" width="270" height="74" rx="10" class="anchor2"/>
  <text x="625" y="958" text-anchor="middle" class="box-title">A2가 TAG_REQUEST 송신</text>
  <text x="625" y="982" text-anchor="middle" class="box-text">data[0] = 7, data[16] = 2</text>

  <rect x="900" y="320" width="250" height="78" rx="10" class="tag"/>
  <text x="1025" y="348" text-anchor="middle" class="box-title">TAG_REQUEST 수신</text>
  <text x="1025" y="372" text-anchor="middle" class="box-text">요청 앵커 ID 확인</text>

  <rect x="900" y="445" width="250" height="78" rx="10" class="tag"/>
  <text x="1025" y="473" text-anchor="middle" class="box-title">TAG_RESPONSE 전송</text>
  <text x="1025" y="497" text-anchor="middle" class="box-text">data[17] = Tag ID</text>

  <rect x="900" y="930" width="250" height="74" rx="10" class="tag"/>
  <text x="1025" y="958" text-anchor="middle" class="box-title">A2 요청에 응답</text>
  <text x="1025" y="982" text-anchor="middle" class="box-text">TAG_RESPONSE → A2</text>

  <rect x="1290" y="205" width="220" height="86" rx="10" class="pc"/>
  <text x="1400" y="235" text-anchor="middle" class="box-title">모니터링</text>
  <text x="1400" y="259" text-anchor="middle" class="box-text">TAG LIST 출력</text>
  <text x="1400" y="279" text-anchor="middle" class="small">A0/A2 탐색 결과 확인</text>

  <rect x="1290" y="610" width="220" height="150" rx="10" class="note"/>
  <text x="1400" y="640" text-anchor="middle" class="box-title">핵심 조건</text>
  <text x="1400" y="670" text-anchor="middle" class="box-text">A1, A3는</text>
  <text x="1400" y="693" text-anchor="middle" class="box-text">TAG_REQUEST 직접 송신 없음</text>
  <text x="1400" y="727" text-anchor="middle" class="box-text">A2만 A0 명령으로</text>
  <text x="1400" y="750" text-anchor="middle" class="box-text">보조 탐색 수행</text>

  <path d="M225 279 L225 320" class="line"/>
  <path d="M360 359 L900 359" class="line"/>
  <text x="635" y="342" text-anchor="middle" class="msg">TAG_REQUEST</text>

  <path d="M1025 398 L1025 445" class="line"/>
  <path d="M900 484 L360 484" class="line"/>
  <text x="635" y="466" text-anchor="middle" class="msg">TAG_RESPONSE</text>
  <path d="M900 500 L760 372" class="dash"/>
  <text x="810" y="435" text-anchor="middle" class="small">A2 passive 수집</text>

  <path d="M225 398 L225 445" class="line"/>
  <path d="M225 585 L225 635" class="line"/>
  <text x="255" y="616" class="small">예</text>
  <path d="M105 515 L70 515 L70 850 L85 850" class="line"/>
  <text x="78" y="496" class="small">아니오</text>

  <path d="M225 775 L225 820" class="line"/>
  <text x="252" y="806" class="small">예, 3회 누적</text>
  <path d="M350 705 L390 705 L390 220 L350 220" class="line"/>
  <text x="362" y="686" class="small">아니오</text>

  <path d="M365 857 L490 857" class="line"/>
  <text x="427" y="838" text-anchor="middle" class="msg">A2_DISCOVERY_GO</text>
  <path d="M625 894 L625 930" class="line"/>
  <path d="M760 967 L900 967" class="line"/>
  <text x="830" y="948" text-anchor="middle" class="msg">TAG_REQUEST</text>
  <path d="M1025 930 L1025 523" class="dash"/>
  <path d="M900 967 L760 967" class="line"/>
  <text x="830" y="992" text-anchor="middle" class="msg">TAG_RESPONSE</text>

  <rect x="80" y="1000" width="1440" height="62" rx="12" fill="#edf2f7" stroke="#cbd5e0"/>
  <text x="800" y="1025" text-anchor="middle" class="box-title">요약</text>
  <text x="800" y="1050" text-anchor="middle" class="box-text">슬레이브 앵커가 TAG_REQUEST를 직접 송신하는 시점은 Anchor2가 Anchor0로부터 A2_DISCOVERY_GO를 수신했을 때이다.</text>
</svg>
