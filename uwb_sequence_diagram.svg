<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2200" viewBox="0 0 1800 2200">
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#171717"/></marker>
    <marker id="openArrow" markerWidth="11" markerHeight="11" refX="10" refY="5.5" orient="auto"><path d="M1,1 L10,5.5 L1,10" fill="none" stroke="#171717" stroke-width="1.8"/></marker>
    <style>
      text { font-family: Arial, 'Malgun Gothic', sans-serif; fill:#151515; }
      .actor { font-size:24px; font-weight:600; text-anchor:middle; }
      .phase { font-size:25px; font-weight:700; text-anchor:middle; }
      .msg { font-size:21px; text-anchor:middle; font-weight:500; }
      .note { font-size:20px; font-style:italic; font-weight:700; text-anchor:middle; }
      .life { stroke:#282828; stroke-width:2.2; stroke-dasharray:5 6; }
      .solid { stroke:#171717; stroke-width:2.6; fill:none; marker-end:url(#arrow); }
      .return { stroke:#171717; stroke-width:2.4; fill:none; stroke-dasharray:8 6; marker-end:url(#openArrow); }
      .frame { stroke:#171717; stroke-width:2.8; fill:#fff; }
      .divider { stroke:#171717; stroke-width:2.6; stroke-dasharray:12 7; }
      .num { fill:#151515; }
      .numtext { fill:#fff; font-size:14px; font-weight:700; text-anchor:middle; dominant-baseline:middle; }
    </style>
  </defs>
  <rect width="1800" height="2200" fill="white"/>

  <!-- actors -->
  <g>
    <rect x="45" y="30" width="210" height="70" rx="8" fill="#f7edf8" stroke="#b56dab" stroke-width="2"/><text x="150" y="74" class="actor">PC Processing</text>
    <rect x="360" y="30" width="230" height="70" rx="8" fill="#e7f7f1" stroke="#65ad98" stroke-width="2"/><text x="475" y="74" class="actor">Master Anchor (A0)</text>
    <rect x="705" y="30" width="250" height="70" rx="8" fill="#fff5e7" stroke="#b99a68" stroke-width="2"/><text x="830" y="74" class="actor">Slave Anchor (A1-A3)</text>
    <rect x="1115" y="30" width="170" height="70" rx="8" fill="#e8f8fa" stroke="#57aabd" stroke-width="2"/><text x="1200" y="74" class="actor">UWB Tag</text>
    <rect x="1450" y="30" width="230" height="70" rx="8" fill="#edf9ee" stroke="#69ad73" stroke-width="2"/><text x="1565" y="74" class="actor">User Application</text>
  </g>
  <g class="life"><line x1="150" y1="100" x2="150" y2="2100"/><line x1="475" y1="100" x2="475" y2="2100"/><line x1="830" y1="100" x2="830" y2="2100"/><line x1="1200" y1="100" x2="1200" y2="2100"/><line x1="1565" y1="100" x2="1565" y2="2100"/></g>

  <!-- Phase 1 -->
  <rect x="60" y="135" width="1620" height="46" fill="#fff2a8" stroke="#b99b32" stroke-width="1.8"/><text x="870" y="166" class="phase">Phase 1: Tag Discovery (태그 탐색)</text>
  <line x1="475" y1="235" x2="1200" y2="235" class="solid"/><circle cx="475" cy="235" r="12" class="num"/><text x="475" y="235" class="numtext">1</text><text x="838" y="215" class="msg">TAG_REQUEST (탐색 요청)</text>
  <rect x="460" y="250" width="755" height="420" class="frame"/><path d="M460 250h60v35l-15 15h-45z" fill="white" stroke="#171717" stroke-width="2.8"/><text x="483" y="280" font-size="21" font-weight="700">alt</text>
  <text x="838" y="325" class="note">[Direct Discovery (정상 수신)]</text>
  <line x1="1200" y1="365" x2="475" y2="365" class="return"/><circle cx="1200" cy="365" r="12" class="num"/><text x="1200" y="365" class="numtext">2</text><text x="838" y="345" class="msg">TAG_RESPONSE</text>
  <line x1="460" y1="390" x2="1215" y2="390" class="divider"/><text x="838" y="420" class="note">[Delegated Discovery (음영 구역 발생 시)]</text>
  <line x1="475" y1="470" x2="830" y2="470" class="solid"/><circle cx="475" cy="470" r="12" class="num"/><text x="475" y="470" class="numtext">3</text><text x="652" y="450" class="msg">A2_DISCOVERY_GO (탐색 위임)</text>
  <line x1="830" y1="525" x2="1200" y2="525" class="solid"/><circle cx="830" cy="525" r="12" class="num"/><text x="830" y="525" class="numtext">4</text><text x="1015" y="505" class="msg">TAG_REQUEST</text>
  <line x1="1200" y1="580" x2="830" y2="580" class="return"/><circle cx="1200" cy="580" r="12" class="num"/><text x="1200" y="580" class="numtext">5</text><text x="1015" y="560" class="msg">TAG_RESPONSE</text>
  <line x1="830" y1="635" x2="475" y2="635" class="return"/><circle cx="830" cy="635" r="12" class="num"/><text x="830" y="635" class="numtext">6</text><text x="652" y="615" class="msg">A2_DISCOVERY_REPORT (발견 목록 보고)</text>

  <!-- Phase 2 -->
  <rect x="60" y="720" width="1620" height="46" fill="#fff2a8" stroke="#b99b32" stroke-width="1.8"/><text x="870" y="751" class="phase">Phase 2: Distance Measurement (거리 측정)</text>
  <rect x="460" y="785" width="755" height="315" class="frame"/><path d="M460 785h60v35l-15 15h-45z" fill="white" stroke="#171717" stroke-width="2.8"/><text x="483" y="815" font-size="21" font-weight="700">alt</text>
  <text x="838" y="845" class="note">[Direct Beacon]</text>
  <line x1="475" y1="895" x2="1200" y2="895" class="solid"/><circle cx="475" cy="895" r="12" class="num"/><text x="475" y="895" class="numtext">7</text><text x="838" y="875" class="msg">BEACON (Tag_ID, riskLevel)</text>
  <line x1="460" y1="925" x2="1215" y2="925" class="divider"/><text x="838" y="957" class="note">[Delegated Beacon]</text>
  <line x1="475" y1="1005" x2="830" y2="1005" class="solid"/><circle cx="475" cy="1005" r="12" class="num"/><text x="475" y="1005" class="numtext">8</text><text x="652" y="985" class="msg">BEACON_DELEGATE (비콘 위임)</text>
  <line x1="830" y1="1060" x2="1200" y2="1060" class="solid"/><circle cx="830" cy="1060" r="12" class="num"/><text x="830" y="1060" class="numtext">9</text><text x="1015" y="1040" class="msg">BEACON (Tag_ID, riskLevel)</text>
  <line x1="1200" y1="1140" x2="1565" y2="1140" class="solid"/><circle cx="1200" cy="1140" r="12" class="num"/><text x="1200" y="1140" class="numtext">10</text><text x="1383" y="1120" class="msg">속도 데이터 요청 (Speed Request)</text>
  <line x1="1565" y1="1195" x2="1200" y2="1195" class="return"/><circle cx="1565" cy="1195" r="12" class="num"/><text x="1565" y="1195" class="numtext">11</text><text x="1383" y="1175" class="msg">속도 전달 (Speed Delivery)</text>

  <!-- Phase 3 -->
  <rect x="60" y="1260" width="1620" height="46" fill="#fff2a8" stroke="#b99b32" stroke-width="1.8"/><text x="870" y="1291" class="phase">Phase 3: Reporting &amp; Processing (데이터 보고 및 처리)</text>
  <rect x="460" y="1325" width="755" height="350" class="frame"/><path d="M460 1325h60v35l-15 15h-45z" fill="white" stroke="#171717" stroke-width="2.8"/><text x="483" y="1355" font-size="21" font-weight="700">alt</text>
  <text x="838" y="1388" class="note">[Direct Report]</text>
  <line x1="1200" y1="1440" x2="475" y2="1440" class="solid"/><circle cx="1200" cy="1440" r="12" class="num"/><text x="1200" y="1440" class="numtext">12</text><text x="838" y="1420" class="msg">FINAL_REPORT (거리리스트, 속력)</text>
  <line x1="460" y1="1470" x2="1215" y2="1470" class="divider"/><text x="838" y="1505" class="note">[Delegated Report]</text>
  <line x1="1200" y1="1555" x2="830" y2="1555" class="solid"/><circle cx="1200" cy="1555" r="12" class="num"/><text x="1200" y="1555" class="numtext">13</text><text x="1015" y="1535" class="msg">DELEGATED_FINAL_REPORT</text>
  <line x1="830" y1="1620" x2="475" y2="1620" class="solid"/><circle cx="830" cy="1620" r="12" class="num"/><text x="830" y="1620" class="numtext">14</text><text x="652" y="1600" class="msg">Relay Report (데이터 릴레이 송신)</text>
  <line x1="475" y1="1740" x2="150" y2="1740" class="solid"/><circle cx="475" cy="1740" r="12" class="num"/><text x="475" y="1740" class="numtext">15</text><text x="312" y="1720" class="msg">거리 및 속도 데이터 전송 (UART)</text>
  <line x1="150" y1="1810" x2="475" y2="1810" class="return"/><circle cx="150" cy="1810" r="12" class="num"/><text x="150" y="1810" class="numtext">16</text><text x="312" y="1790" class="msg">계산된 riskLevel 응답</text>

  <!-- Phase 4 -->
  <rect x="60" y="1875" width="1620" height="46" fill="#fff2a8" stroke="#b99b32" stroke-width="1.8"/><text x="870" y="1906" class="phase">Phase 4: Warning Feedback (위험 알림)</text>
  <line x1="475" y1="1975" x2="1200" y2="1975" class="solid"/><circle cx="475" cy="1975" r="12" class="num"/><text x="475" y="1975" class="numtext">17</text><text x="838" y="1955" class="msg">riskLevel 전송</text>
  <line x1="1200" y1="2035" x2="1565" y2="2035" class="solid"/><circle cx="1200" cy="2035" r="12" class="num"/><text x="1200" y="2035" class="numtext">18</text><text x="1383" y="2015" class="msg">위험도에 따른 경고 UI 출력 (녹/황/적색)</text>
  <g>
    <rect x="45" y="2110" width="210" height="65" rx="8" fill="#f7edf8" stroke="#b56dab" stroke-width="2"/><text x="150" y="2151" class="actor">PC Processing</text>
    <rect x="360" y="2110" width="230" height="65" rx="8" fill="#e7f7f1" stroke="#65ad98" stroke-width="2"/><text x="475" y="2151" class="actor">Master Anchor (A0)</text>
    <rect x="705" y="2110" width="250" height="65" rx="8" fill="#fff5e7" stroke="#b99a68" stroke-width="2"/><text x="830" y="2151" class="actor">Slave Anchor (A1-A3)</text>
    <rect x="1115" y="2110" width="170" height="65" rx="8" fill="#e8f8fa" stroke="#57aabd" stroke-width="2"/><text x="1200" y="2151" class="actor">UWB Tag</text>
    <rect x="1450" y="2110" width="230" height="65" rx="8" fill="#edf9ee" stroke="#69ad73" stroke-width="2"/><text x="1565" y="2151" class="actor">User Application</text>
  </g>
</svg>
